<!DOCTYPE html>
<!--
    Admin base template (task 86). Own CSS (no Bootstrap), local vendor libs
    only (offline). Modal dialogs markup lives here; behavior in
    /static/admin/js/admin_common.js.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}News Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <!-- marked must load before the page scripts that use it (offline vendor copy) -->
    <script src="/static/vendor/marked/marked.min.js"></script>
    <script src="/static/admin/js/admin_common.js"></script>
</head>
<body>
    <!-- Navbar: only existing addresses (the broken "Create News" item is removed) -->
    <nav class="navbar">
        <a class="navbar-brand" href="/admin/news">📰 News Admin</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/admin/news">News List</a>
        </div>
    </nav>

    <!-- Toast messages -->
    <div id="alert-container"></div>

    <!-- Main content -->
    <div class="admin-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Confirm dialog: object name in the body, Cancel is default-focused -->
    <div class="modal-overlay" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <div class="modal-dialog">
            <h6 class="modal-title" id="confirm-title">Confirm</h6>
            <div class="modal-body" id="confirm-name"></div>
            <div class="modal-warning" id="confirm-warning" style="display: none;"></div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" id="confirm-cancel">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-ok">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Unsaved changes dialog: stay / save / discard -->
    <div class="modal-overlay" id="unsaved-modal" role="dialog" aria-modal="true">
        <div class="modal-dialog">
            <h6 class="modal-title">Unsaved changes</h6>
            <div class="modal-body" id="unsaved-label"></div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" id="unsaved-stay">Continue editing</button>
                <button type="button" class="btn btn-primary" id="unsaved-save">Save and switch</button>
                <button type="button" class="btn btn-danger" id="unsaved-discard">Discard changes</button>
            </div>
            <div class="modal-warning" style="display: block;">
                Esc continues editing. "Save and switch" keeps your edits; "Discard changes" drops them.
            </div>
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
